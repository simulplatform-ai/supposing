[project]
name = "supposing"
version = "0.4.0"
description = "Open-source document ranking with LLM judges and confidence intervals."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Supposing Authors" }]
requires-python = ">=3.12"
keywords = ["document-ranking", "ranking", "llm", "llm-as-a-judge", "llm-judge", "pairwise-comparison", "confidence-intervals", "evaluation", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.1",
]

[project.urls]
Homepage = "https://supposing.app"
Documentation = "https://app.supposing.app/docs"
Source = "https://github.com/simulplatform-ai/supposing"
Changelog = "https://github.com/simulplatform-ai/supposing/blob/main/CHANGELOG.md"
Issues = "https://github.com/simulplatform-ai/supposing/issues"
"For agents" = "https://app.supposing.app/llms.txt"

[project.optional-dependencies]
mcp = ["mcp>=2.3"]  # `supposing mcp`: the stdio MCP server

[project.scripts]
supposing = "supposing.cli:main"

[dependency-groups]
dev = ["mcp>=2.3", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supposing"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not stats'"  # the many-trial simulations run with `make check-stats`

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP031", "E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
